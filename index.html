<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
  rel="stylesheet">
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <title>Receipt Generator</title>
</head>

<body style="padding-bottom: 70px;">

  <nav class="navbar" style="background-color: goldenrod;">
    <div class="container-fluid d-flex align-items-center">

  <span class="navbar-brand mb-0" style="color: wheat;">Mercado Ricemeals</span>

  <div class="ms-auto d-flex align-items-center">
  <span class="navbar-brand mb-0" style="color: wheat;">SKU Generator</span>

  <span class="navbar-brand mb-0 ms-3" style="color: wheat;">Receipt Generator</span>
    </div>

    </div>
  </nav>

  <div style="min-height: calc(100vh - 56px); display: flex; justify-content: center; align-items: center;">

    <div style="width: 580px; background-color: wheat; padding: 35px; border-radius: 15px">

      <h1 style="text-align: center; color: goldenrod; margin-bottom: 30px;">
        Receipt Generator - Ricemeals</h1>

      <div style="background: white; padding: 13px; border-radius: 7px; margin-bottom: 12px;">
        <input type="checkbox" id="prod1" value="90">
        <label for="prod1">Tapa ricemeal — ₱90</label>
      </div>

      <div style="background: white; padding: 13px; border-radius: 7px; margin-bottom: 12px;">
        <input type="checkbox" id="prod2" value="95">
        <label for="prod2">Adobo ricemeal — ₱95</label>
      </div>

      <div style="background: white; padding: 13px; border-radius: 7px; margin-bottom: 20px;">
        <input type="checkbox" id="prod3" value="120">
        <label for="prod3">Jumbo egg ricemeal — ₱120</label>
      </div>

      <button
        type="submit"
        py-click="create_order"
        style="width: 100%; padding: 14px; background-color: goldenrod; color: white; border: none; border-radius: 7px; font-size: 16px;">Create Order</button>

      <hr style="margin: 25px 0;">

      <p style="text-align: center; color: gray;">
        Your generated receipt will appear here.</p>

      <div id="show" style="text-align: center;"></div>

    </div>
  </div>

  

  <py-script src="main.py"></py-script>

  <footer style="background-color: goldenrod; color: wheat; text-align: center; padding: 18px; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000;">
    <p style="margin: 0;">Mercado Ricemeals — 1st Quarter Project</p>
  </footer>

</body>
</html>
